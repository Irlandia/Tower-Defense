# Uploads the game to InfinityFree over FTP on every push to main (or manually from the Actions tab).
# Required repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /towerdefense.infinityfree.io/htdocs/
          # only changed files are uploaded; state is kept in .ftp-deploy-sync-state.json on the server
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            docs/**
            tests/**
            CLAUDE.md
