# Runs the headless browser tests, then uploads the game to InfinityFree over FTP (push to main or manually).
# Required repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve the repo
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1

      - name: Run sim / render / client tests (headless Chrome)
        run: |
          fail=0
          for t in sim render client; do
            out=$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=300000 \
              --dump-dom "http://localhost:8080/tests/$t.html" 2>/dev/null)
            if echo "$out" | grep -q "ALL PASSED</pre>"; then
              echo "✔ $t"
            else
              echo "✘ $t"; echo "$out" | grep -E "^(FAIL|ERROR)" | head -20; fail=1
            fi
          done
          exit $fail

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every release gets its own id: build.json (polled by src/client/update.js), the page's
      # <meta name="build"> and ?v= on the entry script and stylesheet, so no stale copy survives.
      - name: Stamp the build id
        run: |
          BUILD="$(git rev-parse --short HEAD)-$(date +%s)"
          printf '{ "build": "%s" }\n' "$BUILD" > build.json
          sed -i "s#<meta name=\"build\" content=\"dev\">#<meta name=\"build\" content=\"$BUILD\">#" index.html
          sed -i "s#src=\"src/main.js\"#src=\"src/main.js?v=$BUILD\"#; s#href=\"style.css\"#href=\"style.css?v=$BUILD\"#; s#src=\"vendor/peerjs.min.js\"#src=\"vendor/peerjs.min.js?v=$BUILD\"#" index.html
          # an import map gives every module its own ?v=, so nested imports can never come from an old cache
          MAP=$(find src -name '*.js' | sort | awk -v b="$BUILD" '{ printf "%s\"./%s\": \"./%s?v=%s\"", (NR > 1 ? "," : ""), $0, $0, b }')
          sed -i "s#<script type=\"module\" src=\"src/main.js#<script type=\"importmap\">{ \"imports\": { $MAP } }</script>\n  <script type=\"module\" src=\"src/main.js#" index.html
          grep -c "importmap" index.html
          grep -n "$BUILD" build.json

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /towerdefense.infinityfree.io/htdocs/
          # only changed files are uploaded; state is kept in .ftp-deploy-sync-state.json on the server
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            .codegraph/**
            .idea/**
            docs/**
            tests/**
            CLAUDE.md
