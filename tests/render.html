<!doctype html>
<meta charset="utf-8">
<title>Render smoke test</title>
<canvas id="c" width="640" height="360"></canvas>
<pre id="out">running…</pre>
<script type="module">
// Draws frames in every mode / player count / UI state to catch renderer exceptions (they freeze the game loop).
import { createGame, step, canPlace } from '../src/sim/sim.js';
import { TOWER_ORDER, COLS, ROWS } from '../src/sim/data.js';
import { Renderer } from '../src/render.js';
import { Critters } from '../src/critters.js';

const out = [];
let failed = 0;
const r = new Renderer(document.getElementById('c'));
for (const mode of ["classic", "circle"]) {
  for (const players of [1, 2]) {
   for (const season of ["spring", "summer", "autumn", "winter"]) {
    for (let me = 0; me < players; me++) {
      const name = `${mode} players=${players} me=${me} ${season}`;
      try {
        const s = createGame(42, { mode, players, season });
        const free = [];
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (canPlace(s, x, y)) free.push([x, y]);
        step(s, TOWER_ORDER.map((kind, i) => ({ type: 'place', kind: i === 5 ? 'totem' : i % 3 === 0 ? 'arrow' : 'frost', tx: free[i * 7][0], ty: free[i * 7][1], p: i % players })));
        step(s, [{ type: 'nextWave', p: 0 }, { type: 'wall', tx: 0, ty: 0, p: me }]);
        for (let i = 0; i < 200; i++) step(s);
        const uis = [
          { me, build: 'cannon', hover: { tx: free[3][0], ty: free[3][1] }, mouse: { x: 100, y: 100 } },
          { me, selected: 't' + s.towers[0].id, hover: { tx: 1, ty: 1 } },
          { me, ability: 'meteor', mouse: { x: 120, y: 120 }, hover: { tx: 5, ty: 5 } },
          { me, ability: 'wall', hover: { tx: 5, ty: 5 } },
          { me, moving: s.towers[0].id, hover: { tx: free[5][0], ty: free[5][1] } },
          { me },
        ];
        r.onEvents([{ type: "bossSpawn", id: s.enemies[0]?.id ?? 0, kind: "boss", wave: 5 }, { type: "bossRage", id: s.enemies[0]?.id ?? 0, wave: 5 }]);
        for (const ui of uis) r.draw(s, 0.5, ui, 0.016);
        out.push('PASS ' + name);
      } catch (e) {
        failed++;
        out.push('FAIL ' + name + '\n  ' + e.stack);
      }
    }
   }
  }
}
// fish: leap, click a fish in the air, click empty water, and draw it all
try {
  const s = createGame(42, { mode: "classic", season: "summer" });
  const c = new Critters();
  c.reset(s.map, "summer");
  const water = [...s.map.water][0];
  if (water) {
    const [wx, wy] = water.split(",").map(Number);
    c.leap(wx * 24 + 12, wy * 24 + 12, { gold: true });
    for (let i = 0; i < 10; i++) c.update(0.03, []);
    const p = c.fishPos(c.jumps[0]);
    const hitFish = c.pokeFish(p.x, p.y);
    const hitWater = c.pokeFish(wx * 24 + 12, wy * 24 + 12);
    const g = document.getElementById("c").getContext("2d");
    for (let i = 0; i < 30; i++) { c.update(0.05, []); c.drawFish(g); }
    if (!hitFish || !hitWater) throw new Error("fish clicks not handled");
  }
  out.push("PASS fish leap + clicks" + (water ? "" : " (no pond on this map)"));
} catch (e) { failed++; out.push("FAIL fish " + e.stack); }
out.push(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = out.join('\n');
</script>
