<!doctype html>
<meta charset="utf-8">
<title>Render smoke test</title>
<canvas id="c" width="640" height="360"></canvas>
<pre id="out">running…</pre>
<script type="module">
// Draws frames in every mode / player count / UI state to catch renderer exceptions (they freeze the game loop).
import { createGame, step, canPlace } from '../src/sim/sim.js';
import { spawn } from '../src/sim/combat.js';
import { TOWER_ORDER, COLS, ROWS } from '../src/sim/data.js';
import { Renderer } from '../src/render.js';
import { Critters } from '../src/critters.js';
import * as Meta from '../src/meta.js';
import { renderTreeView } from '../src/treeui.js';

const out = [];
let failed = 0;
const r = new Renderer(document.getElementById('c'));
for (const mode of ["classic", "circle"]) {
  for (const players of [1, 2, 4]) {
   for (const season of ["spring", "summer", "autumn", "winter"]) {
    for (let me = 0; me < players; me++) {
      const name = `${mode} players=${players} me=${me} ${season}`;
      try {
        const s = createGame(42, { mode, players, season });
        const free = [];
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (canPlace(s, x, y)) free.push([x, y]);
        step(s, TOWER_ORDER.map((kind, i) => ({ type: 'place', kind: i === 5 ? 'totem' : i % 3 === 0 ? 'arrow' : 'frost', tx: free[i * 7][0], ty: free[i * 7][1], p: i % players })));
        step(s, [{ type: 'nextWave', p: 0 }, { type: 'wall', tx: 0, ty: 0, p: me }]);
        for (let i = 0; i < 200; i++) step(s);
        const uis = [
          { me, build: 'cannon', hover: { tx: free[3][0], ty: free[3][1] }, mouse: { x: 100, y: 100 } },
          { me, selected: 't' + s.towers[0].id, hover: { tx: 1, ty: 1 } },
          { me, ability: 'meteor', mouse: { x: 120, y: 120 }, hover: { tx: 5, ty: 5 } },
          { me, ability: 'wall', hover: { tx: 5, ty: 5 } },
          { me, moving: s.towers[0].id, hover: { tx: free[5][0], ty: free[5][1] } },
          { me },
        ];
        r.onEvents([{ type: "bossSpawn", id: s.enemies[0]?.id ?? 0, kind: "boss", wave: 5 }, { type: "bossRage", id: s.enemies[0]?.id ?? 0, wave: 5 }]);
        for (const ui of uis) r.draw(s, 0.5, ui, 0.016);
        out.push('PASS ' + name);
      } catch (e) {
        failed++;
        out.push('FAIL ' + name + '\n  ' + e.stack);
      }
    }
   }
  }
}
// abilities: four slots, the new targeted abilities with their previews, Overdrive sparks on towers
try {
  const s4 = createGame(42, { mode: 'classic', season: 'summer', perks: [{ abilities: ['meteor', 'goldrain', 'overdrive', 'quake'] }] });
  const free4 = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (canPlace(s4, x, y)) free4.push([x, y]);
  step(s4, [{ type: 'place', kind: 'arrow', tx: free4[0][0], ty: free4[0][1], p: 0 }, { type: 'nextWave', p: 0 }]);
  step(s4, [{ type: 'overdrive', p: 0 }]);
  for (let i = 0; i < 120; i++) step(s4);
  r.onEvents([{ type: 'goldrain', x: 120, y: 120, r: 60, p: 0 }, { type: 'quake', x: 150, y: 110, r: 70, p: 0 }, { type: 'overdrive', p: 0 }]);
  for (const ui of [
    { me: 0, ability: 'goldrain', mouse: { x: 120, y: 120 }, hover: { tx: 5, ty: 5 } },
    { me: 0, ability: 'quake', mouse: { x: 150, y: 110 }, hover: { tx: 6, ty: 4 } },
    { me: 0, ability: 'overdrive', hover: { tx: 6, ty: 4 } },
    { me: 0 },
  ]) r.draw(s4, 0.5, ui, 0.016);
  out.push('PASS abilities: goldrain / quake previews, overdrive sparks, 4 slots');
} catch (e) { failed++; out.push('FAIL abilities ' + e.stack); }

// rotation mobs: every look, state icon and juice event must draw without exceptions
try {
  const s = createGame(42, { mode: 'classic', season: 'summer' });
  s.lives = 1e6;
  const kinds = ['cloud', 'tinman', 'drummer', 'froglet', 'shellback', 'roller', 'mistling', 'gnats', 'magpie', 'bonepile'];
  kinds.forEach((k, i) => { const e = spawn(s, k, 0, 60 + i * 18, 1); e.speedMul = 0; });
  const [cloud, tin, drum, frog, shell] = s.enemies;
  const [roller, mist, , mag, bone] = s.enemies.slice(5);
  roller.rollV = 40; mag.loot = [5, 5]; bone.pile = 8; mist.mist = true;
  tin.armor = 4; frog.leapT = 4; shell.shellT = 10; cloud.wetT = 20; shell.flash = 2;
  s.wave = 7;
  r.onEvents([
    { type: 'rain', id: cloud.id, x: cloud.x, y: cloud.y, r: 40, n: 2 }, { type: 'shed', id: tin.id, x: tin.x, y: tin.y, armor: 3 },
    { type: 'leap', id: frog.id, x: frog.x, y: frog.y }, { type: 'shell', id: shell.id, x: shell.x, y: shell.y, on: true },
    { type: 'shell', id: shell.id, x: shell.x, y: shell.y, on: false }, { type: 'drum', id: drum.id, x: drum.x, y: drum.y, n: 3 },
    { type: 'reveal', id: mist.id, x: mist.x, y: mist.y }, { type: 'pile', id: bone.id, x: bone.x, y: bone.y, gold: 3 }, { type: 'rise', id: bone.id, x: bone.x, y: bone.y },
    { type: 'magpie', id: mag.id, x: mag.x, y: mag.y }, { type: 'magpieDrop', x: mag.x, y: mag.y, n: 3 },
    { type: 'death', x: cloud.x, y: cloud.y, kind: 'cloud', gold: 5, p: 0 }, { type: 'death', x: tin.x, y: tin.y, kind: 'shellback', gold: 6, p: 0 },
  ]);
  for (let i = 0; i < 6; i++) { r.draw(s, 0.5, { me: 0 }, 0.016); step(s); }
  frog.slowT = 10; frog.slowF = 0; // frozen look of a hopper
  r.draw(s, 0.5, { me: 0 }, 0.016);
  out.push('PASS rotation mobs: sprites, state icons and events');
} catch (e) { failed++; out.push('FAIL rotation mobs ' + e.stack); }

// decoration: the ent stroll and the mermaid's leaps draw in every phase without errors
try {
  const se = createGame(4, { season: 'spring' });
  r.draw(se, 0.5, { me: 0 }, 0.016);
  const tree = se.obstacles.find((o) => o.kind === 'tree');
  for (const phase of ['wake', 'walk', 'look', 'back', 'sink']) {
    r.ents = [{ id: tree.id, dx: 1, dy: 0, phase, t: 0.5, x: 6, y: 0, lift: 3, say: 'Хм…', season: 'winter' }];
    r.draw(se, 0.5, { me: 0 }, 0.016);
  }
  const m = r.critters.mermaid;
  if (m) for (const state of ['rise', 'sit', 'scared', 'dive', 'away']) { m.state = state; m.t = 0.3; r.draw(se, 0.5, { me: 0, mouse: { x: m.x || 0, y: m.y || 0 } }, 0.016); }
  out.push(`PASS decor: ent (5 phases) and mermaid (${m ? 'all states' : 'no pond spot on this map'}) draw`);
} catch (e) { failed++; out.push('FAIL decor ' + e.stack); }

// talent tree screen (src/treeui.js): renders the tree as DOM, buying and refunding redraws it
try {
  Meta.setPersist(false);
  const host = document.createElement('div');
  document.body.append(host);
  const m = Meta.newMeta();
  m.xp = Meta.xpForLevel(5); // level 5 = 5 points
  const redraw = () => renderTreeView(host, m, redraw);
  redraw();
  const nodes = host.querySelectorAll('.tv-node');
  if (nodes.length !== Meta.TREE.length) throw new Error(`nodes ${nodes.length} != ${Meta.TREE.length}`);
  if (host.querySelectorAll('.tv-build.locked').length !== 2) throw new Error('build tabs: 2 should be locked at level 5');
  if (host.querySelectorAll('.tv-col').length !== 4) throw new Error('4 branch trunks expected');
  if (host.querySelectorAll('.tv-tier.closed').length === 0) throw new Error('higher tiers should be closed at start');
  host.querySelector('[data-id="a1"]').click();
  if (Meta.rankOf(m, 'a1') !== 1) throw new Error('left click should buy a rank');
  host.querySelector('[data-id="a1"]').dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
  if (Meta.rankOf(m, 'a1') !== 0) throw new Error('right click should take the rank back');
  for (let i = 0; i < 3; i++) host.querySelector('[data-id="a1"]').click();
  host.querySelector('[data-id="a4"]').click();
  if (Meta.rankOf(m, 'a4') !== 1) throw new Error('tier 2 should open after 3 points');
  host.querySelector('.tv-slot').click();
  if (!host.querySelector('.tv-pick')) throw new Error('slot picker should open');
  host.querySelector('.tv-pick-item').click();
  out.push('PASS talent tree: nodes, tiers, builds, buy / refund / slot picker');
} catch (e) { failed++; out.push('FAIL talent tree ' + e.stack); }

// fish: leap, click a fish in the air, click empty water, and draw it all
try {
  const s = createGame(42, { mode: "classic", season: "summer" });
  const c = new Critters();
  c.reset(s.map, "summer");
  const water = [...s.map.water][0];
  if (water) {
    const [wx, wy] = water.split(",").map(Number);
    c.leap(wx * 24 + 12, wy * 24 + 12, { gold: true });
    for (let i = 0; i < 10; i++) c.update(0.03, []);
    const p = c.fishPos(c.jumps[0]);
    const hitFish = c.pokeFish(p.x, p.y);
    const hitWater = c.pokeFish(wx * 24 + 12, wy * 24 + 12);
    const g = document.getElementById("c").getContext("2d");
    for (let i = 0; i < 30; i++) { c.update(0.05, []); c.drawFish(g); }
    if (!hitFish || !hitWater) throw new Error("fish clicks not handled");
  }
  out.push("PASS fish leap + clicks" + (water ? "" : " (no pond on this map)"));
} catch (e) { failed++; out.push("FAIL fish " + e.stack); }
out.push(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = out.join('\n');
</script>
