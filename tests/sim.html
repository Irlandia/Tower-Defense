// Free tiles sorted by how much road is within 3 tiles.
function spots(s) {
  const road = [...s.map.tiles].map((k) => k.split(',').map(Number));
  const out = [];
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    if (!canPlace(s, tx, ty)) continue;
    out.push({ tx, ty, n: road.filter(([x, y]) => Math.hypot(x - tx, y - ty) <= 3).length });
  }
  return out.sort((a, b) => b.n - a.n);
}
const free = (s, n) => spots(s).slice(0, n).map((p) => [p.tx, p.ty]);

// Simple bot: cycles tower types, upgrades/evolves when rich, picks first card, uses abilities.
function runBot(seed, maxWaves, opts = {}) {
  const s = createGame(seed, opts);
  const pl = s.players[0];
  const SP = spots(s);
  let i = 0, guard = 0;
  const hashes = [];
  while (!s.over && s.wave <= maxWaves && guard++ < 200000) {
    const cmds = [];
    if (s.players[0].drafts.length) cmds.push({ type: "pick", index: 0 });
    const kind = TOWER_ORDER[i % TOWER_ORDER.length];
    const spot = SP.find((p) => canPlace(s, p.tx, p.ty));
    if (spot && pl.gold >= TOWERS[kind].cost) { cmds.push({ type: 'place', kind, tx: spot.tx, ty: spot.ty }); i++; }
    else if (pl.gold > 250) {
      const e = s.towers.find(canEvolve);
      const t = s.towers.find((t) => t.level < 3 && !TOWERS[t.kind].from);
      if (e) cmds.push({ type: 'evolve', id: e.id, kind: BRANCHES[e.kind][e.id % 2] });
      else if (t) cmds.push({ type: 'upgrade', id: t.id });
    }
    if (s.enemies.length > 4) {
      const lead = s.enemies.reduce((a, b) => (a.dist > b.dist ? a : b));
      if (pl.cds.meteor === 0) cmds.push({ type: 'meteor', x: lead.x, y: lead.y });
      if (pl.cds.nova === 0) cmds.push({ type: 'nova' });
    }
    step(s, cmds);
    if (s.tick % 100 === 0) hashes.push(`${s.tick}:${pl.gold}:${s.lives}:${s.enemies.length}:${s.enemies.reduce((a, e) => a + e.hp + e.dist, 0).toFixed(3)}`);
  }
  return { s, hash: hashes.join('|') };
}

try {

  // map generation sanity over many seeds

  const ev = createGame(3, { bonusGold: 2000 });

  const tw = ev.towers[0];
  step(ev, [{ type: 'evolve', id: tw.id, kind: 'sniper' }]);
  check('cannot evolve before level 3', tw.kind === 'arrow');
  step(ev, [{ type: 'upgrade', id: tw.id }, { type: 'upgrade', id: tw.id }, { type: 'evolve', id: tw.id, kind: 'mortar' }]);
  check('cannot evolve into other family', tw.kind === 'arrow' && tw.level === 3);
  step(ev, [{ type: 'evolve', id: tw.id, kind: 'sniper' }]);
  check('evolve to sniper', tw.kind === 'sniper');
  const ob = ev.obstacles[0], g0 = ev.players[0].gold;
  step(ev, [{ type: 'clear', id: ob.id }]);
  check('clear obstacle', !ev.obstacles.includes(ob) && ev.players[0].gold === g0 - (ob.kind === 'tree' ? 15 : 25) + (ob.chest ? 45 : 0));
  step(ev, [{ type: 'barrel', id: 1 }, { type: 'barrel', id: 1 }]);
  check('barrel used once per wave', !ev.barrels[0].ready && ev.events.filter((e) => e.type === 'barrel').length === 1);

  // abilities + smite + barricade
  const ab = createGame(7);
  step(ab, [{ type: 'nextWave' }]);
  for (let i = 0; i < 60; i++) step(ab);
  const tgt = ab.enemies[0];
  const hp0 = tgt.hp;



  step(ab, [{ type: 'nova' }]);
  check('nova freezes everyone', ab.enemies.every((e) => e.slowF === 0 && e.wetT > 0) && ab.players[0].cds.nova > 0);
  step(ab, [{ type: 'nova' }]);
  check('nova respects cooldown', ab.events.filter((e) => e.type === 'nova').length === 0);
  const lead = ab.enemies.reduce((p, q) => (p.dist > q.dist ? p : q));
  const ahead = posAt(ab.map, lead.lane, lead.dist + 30);
  const wt = [Math.floor(ahead.x / 24), Math.floor(ahead.y / 24)];
  step(ab, [{ type: 'wall', tx: wt[0], ty: wt[1] }]);
  check('wall placed on road', ab.walls.length === 1 && isRoad(ab, wt[0], wt[1]));
  for (let i = 0; i < 120; i++) step(ab);
  check('wall blocks / takes damage', ab.walls.length === 0 || ab.walls[0].hp < ab.walls[0].max || ab.enemies.some((e) => e.blocked));

  // circle mode: one looping lane, enemies never leak, overflow = defeat
  let loopOk = true;
  for (let seed = 1; seed <= 100; seed++) {
    const cm = createGame(seed, { mode: "circle" });
    const L = cm.map.lanes[0];
    const a = posAt(cm.map, 0, L.loopStart + 5), b = posAt(cm.map, 0, L.loopStart + L.loopLen + 5);
    if (!L.loop || cm.map.lanes.length !== 1 || Math.abs(a.x - b.x) > 0.01 || Math.abs(a.y - b.y) > 0.01) loopOk = false;
  }

  const ci = createGame(5, { mode: "circle" });

  // circle with two players: second entry from the right, both closed loops, waves use both, no barrels

  // tower relocation: range, cooldown, ownership

  step(mv, [{ type: "move", id: mt.id, tx: near[0], ty: near[1], p: 1 }]);
  check("move: cannot move partner tower", mt.tx === m1[0] && mt.ty === m1[1]);
  step(mv, [{ type: "move", id: mt.id, tx: near[0], ty: near[1], p: 0 }]);
  check("move: relocates within range, starts cooldown", mt.tx === near[0] && mt.ty === near[1] && mt.moveCd > 0 && !canPlace(mv, near[0], near[1]) && canPlace(mv, m1[0], m1[1]));
  step(mv, [{ type: "move", id: mt.id, tx: m1[0], ty: m1[1], p: 0 }]);
  check("move: cooldown blocks a second move", mt.tx === near[0]);
  for (let i = 0; i < 30 * 20; i++) step(mv);
  step(mv, [{ type: "move", id: mt.id, tx: m1[0], ty: m1[1], p: 0 }]);
  check("move: allowed again after 30 s", mt.tx === m1[0] && mt.ty === m1[1]);

  // totem auras: buff nearby towers, upgrade levels cost more each time, no stacking
  const tg = createGame(13, { bonusGold: 3000 });
  const road = [...tg.map.tiles].map((k) => k.split(",").map(Number));
  let ta = null, tb = null;
  for (let ty = 0; ty < ROWS && !tb; ty++) for (let tx = 0; tx < COLS - 1 && !tb; tx++) {
    if (canPlace(tg, tx, ty) && canPlace(tg, tx + 1, ty)) { ta = [tx, ty]; tb = [tx + 1, ty]; }
  }
  step(tg, [{ type: "place", kind: "arrow", tx: ta[0], ty: ta[1], p: 0 }, { type: "place", kind: "totem", tx: tb[0], ty: tb[1], p: 0 }]);
  const [archer, totem] = tg.towers;
  const base = towerStats(tg, archer);
  const g1 = tg.players[0].gold;
  step(tg, [{ type: "aura", id: totem.id, aura: "dmg", p: 0 }, { type: "aura", id: totem.id, aura: "dmg", p: 0 }, { type: "aura", id: totem.id, aura: "rate", p: 0 }]);
  const buffed = towerStats(tg, archer);
  check("totem: auras raise damage and attack speed of neighbours", buffed.dmg > base.dmg * 1.19 && buffed.period < base.period, `dmg ${base.dmg}->${buffed.dmg}`);
  check("totem: aura levels get pricier (60+110+60)", g1 - tg.players[0].gold === 230);
  step(tg, [{ type: "aura", id: totem.id, aura: "dmg", p: 0 }, { type: "aura", id: totem.id, aura: "dmg", p: 0 }]);
  check("totem: max 3 aura levels", totem.aura.dmg === 3);
  check("totem: never shoots, cannot evolve", !canEvolve(totem) && towerStats(tg, totem).dmg === 0);
  void road;

  // barricade: one standing wall per player
  const bw = createGame(7);
  const rt = [...bw.map.tiles].map((k) => k.split(",").map(Number)).filter(([x]) => x >= 0);
  step(bw, [{ type: "wall", tx: rt[2][0], ty: rt[2][1], p: 0 }]);
  bw.players[0].cds.wall = 0;
  step(bw, [{ type: "wall", tx: rt[6][0], ty: rt[6][1], p: 0 }]);
  check("barricade: only one standing per player", bw.walls.length === 1);

  // circle win: wave 20 out and its bosses dead is enough, leftover small enemies do not block the choice
  const cw = createGame(31, { mode: "circle" });
  cw.wave = 19;
  cw.limit = 1e9; // no towers in this test: do not lose to overflow first
  step(cw, [{ type: "nextWave", p: 0 }]);
  for (let i = 0; i < 6000 && !cw.over; i++) {
    step(cw);
    for (const e of cw.enemies) if (e.type === "king") e.hp = 0, e.dead = true;
  }
  check("circle: victory offered after wave 20 bosses die even with enemies left", cw.won && cw.over && cw.wave === 20, `won=${cw.won} alive=${cw.enemies.length}`);

  // endless circle: continue after the win, waves go past 20 with more bosses
  const en = createGame(21, { mode: "circle" });
  en.wave = 20; en.won = true; en.over = true;
  step(en, [{ type: "continue", p: 0 }]);
  check("endless: continue reopens the run", !en.over && en.endless && !en.won);
  step(en, [{ type: "nextWave", p: 0 }]);
  step(en, [{ type: "nextWave", p: 0 }]);
  while (en.queue.length) { en.queue = en.queue.filter((q) => false); }
  step(en, [{ type: "nextWave", p: 0 }]);
  check("endless: waves keep coming past 20", en.wave === 21 || en.wave > 20);
  const en2 = createGame(21, { mode: "circle" });
  en2.wave = 21; en2.endless = true;
  step(en2, [{ type: "nextWave", p: 0 }]);
  const bosses = en2.queue.filter((q) => q.type === "boss" || q.type === "king").length;
  check("endless: boss waves every 2 waves after 20", en2.wave === 22 && bosses >= 1, `bosses=${bosses}`);

  // tower vs enemy type
  check("enemy types: runner weak to arrows, resists cannons", vsMult("runner", "arrow") > 1 && vsMult("runner", "cannon") < 1 && vsMult("runner", null) === 1);

      const pl2 = tg2.players[0];

          offered[md].add(id);
          const card = CARDS.find((c) => c.id === id);
          total++; if (card.rarity === "rare") rare++;
          if ((pl2.picked[id] || 0) >= card.max) maxOk = false;
        }
        step(tg2, [{ type: "pick", index: 0, p: 0 }]);
      }
    }
  }
  const only = (md) => CARDS.filter((c) => c.modes && !c.modes.includes(md)).map((c) => c.id);

  check("talents: circle never offers classic-only cards", only("circle").every((id) => !offered.circle.has(id)));
  check("talents: mode cards do appear in their mode", offered.classic.has("walls") && offered.circle.has("dam"));
  check("talents: a card is never offered past its max", maxOk);
  check("talents: rare cards are rarer", rare / total > 0.1 && rare / total < 0.55, `rare ${Math.round(100 * rare / total)}%`);

  // bosses: one per player, arriving right after the announcement

    bs.wave = 4;
    step(bs, [{ type: "nextWave", p: 0 }]);
    let first = -1, count = 0;
    for (let i = 0; i < 200; i++) { step(bs); for (const e of bs.events) if (e.type === "bossSpawn") { count++; if (first < 0) first = i; } }
    check(`bosses: ${md} with ${np} player(s) -> ${np} boss(es) within 5 s`, count === np && first >= 0 && first < 100, `count=${count} first=${first}`);
  }

  // multi-lane waves: every entry starts its own stream at once (not alternating packs)
  const par = createGame(3, { mode: "circle", players: 2 });
  step(par, [{ type: "nextWave", p: 0 }]);
  const firstSecs = par.queue.filter((q) => q.at <= par.tick + 3 * 20 && q.type !== "boss");

  const perLane = [0, 1].map((l) => par.queue.filter((q) => q.lane === l).length);
  check("circle 2p: the wave is split evenly between entries", Math.abs(perLane[0] - perLane[1]) <= 3, `${perLane}`);

  // talents respect locked towers and mode

    const lk = createGame(seed, { locked: ["fire", "tesla"] });

    }
  }
  check("talents: no cards for locked towers", lockOk);
  check("talents: steam is not offered in circle mode", !circSteam);

  // co-op prank talents: only with two players; roulette pays one of them; pickpocket skims at wave start

  check("prank talents never offered in solo", !soloPrank);

  CARDS.find((c) => c.id === "roulette").apply(pr, pr.players[0]);
  check("roulette: exactly one player gets 250", pr.players[0].gold + pr.players[1].gold === before + 250);
  CARDS.find((c) => c.id === "thief").apply(pr, pr.players[0]);
  pr.players[1].gold = 400;
  const pg0 = pr.players[0].gold;
  step(pr, [{ type: "nextWave", p: 0 }]);
  check("thief: takes 4% of partner gold (max 20) at wave start", pr.players[1].gold === 384 && pr.players[0].gold === pg0 + 16, `${pr.players[1].gold}`);

  const skillOf = (wave) => {

  const b5 = skillOf(5), b10 = skillOf(10), b15 = skillOf(15), b20 = skillOf(20);
  check("boss skills: Grok dashes", b5.seen.has("dash"));
  check("boss skills: Slime Mother spawns slimes", b10.seen.has("brood") && b10.slimes >= 2, `slimes=${b10.slimes}`);
  check("boss skills: Baron uses magnet", b15.seen.has("magnet"));

  const seaCount = {};
  for (let seed = 1; seed <= 80; seed++) { const sg = createGame(seed); seaCount[sg.season] = (seaCount[sg.season] || 0) + 1; }

  const autumnTrees = createGame(4, { season: "autumn" }).obstacles.filter((o) => o.kind === "tree").length;

  check("tree: towers locked per player", pk.towers.length === 2);
  check("tree: bonus gold per player", pk.players[0].gold === 160 + 100 - 50 && pk.players[1].gold === 110);
  check("tree: totem discount", placeCost(pk, 0, "totem") === 68 && placeCost(pk, 1, "totem") === 90);

  // up to 4 players: circle gets an entry per player (left, right, top, bottom), all closed loops
  let fourOk = true, fourMsg = "";
  for (const np of [3, 4]) for (let seed = 1; seed <= 60; seed++) {
    const c4 = createGame(seed, { mode: "circle", players: np });
    if (c4.map.lanes.length !== np || c4.players.length !== np) { fourOk = false; fourMsg = `n=${np} seed ${seed}`; continue; }
    for (let l = 0; l < np; l++) {
      const L = c4.map.lanes[l];
      const a = posAt(c4.map, l, L.loopStart + 3), b = posAt(c4.map, l, L.loopStart + L.loopLen + 3);
      if (Math.abs(a.x - b.x) > 0.01 || Math.abs(a.y - b.y) > 0.01) { fourOk = false; fourMsg = `n=${np} seed ${seed} lane ${l}`; }
    }
  }
  check("4 players: circle has one closed entry per player", fourOk, fourMsg);
  const q4 = createGame(8, { mode: "circle", players: 4 });
  step(q4, [{ type: "nextWave", p: 0 }]);
  check("4 players: a wave comes from all four entries", new Set(q4.queue.map((q) => q.lane)).size === 4);
  const f4 = free(q4, 4);
  step(q4, f4.map(([tx, ty], i) => ({ type: "place", kind: "arrow", tx, ty, p: i })));
  check("4 players: each builds from own gold", q4.towers.length === 4 && q4.players.every((q) => q.gold === 110) && new Set(q4.towers.map((t) => t.owner)).size === 4);

  // farm: near the centre, never on road or water, no building on it
  let farmOk = true, farms = 0, farmMsg = "";
  for (const md of ["classic", "circle"]) for (let seed = 1; seed <= 60; seed++) {
    const fg = createGame(seed, { mode: md });
    const f = fg.map.farm;
    if (!f) continue;
    farms++;
    for (const k of f.tiles) {
      const [x, y] = k.split(",").map(Number);
      if (fg.map.tiles.has(k) || fg.map.water.has(k) || canPlace(fg, x, y)) { farmOk = false; farmMsg = `${md} seed ${seed}`; }
    }
    if (fg.obstacles.some((o) => f.tiles.has(o.tx + "," + o.ty)) || fg.barrels.some((b) => f.tiles.has(b.tx + "," + b.ty))) { farmOk = false; farmMsg = `objects on farm ${md} ${seed}`; }
  }
  check("farm: placed on most maps, off road/water, unbuildable", farmOk && farms >= 90, `${farms}/120 ${farmMsg}`);

  // weekly brawl: each ruleset changes the game
  const brawlGame = (id) => { const wk = BRAWLS.findIndex((b) => b.id === id); return createGame(5, { mode: "brawl", week: wk }); };
  const stormG = brawlGame("storm");
  check("brawl storm: only archer/tesla/totem, enemies always wet", isLocked(stormG, 0, "cannon") && !isLocked(stormG, 0, "tesla") && (step(stormG, [{ type: "nextWave", p: 0 }]), [...Array(80)].forEach(() => step(stormG)), stormG.enemies.every((e) => e.wetT > 0)));
  const greedG = brawlGame("greed");
  check("brawl greed: 400 start gold, no kill gold", greedG.players[0].gold === 400);
  const slimeG = brawlGame("slime");
  step(slimeG, [{ type: "nextWave", p: 0 }]);
  check("brawl slime: circle board, only slimes/splitters", slimeG.mode === "circle" && slimeG.queue.every((q) => q.type === "slime" || q.type === "splitter"));
  const bossG = brawlGame("bossrush");
  step(bossG, [{ type: "nextWave", p: 0 }]); bossG.queue = []; bossG.enemies = [];
  step(bossG, [{ type: "nextWave", p: 0 }]);
  check("brawl bossrush: a boss on wave 2", bossG.wave === 2 && bossG.queue.some((q) => q.type === "boss"));
  const rushG = brawlGame("rush");
  step(rushG, [{ type: "nextWave", p: 0 }]); for (let i = 0; i < 40; i++) step(rushG);
  check("brawl rush: enemies faster", rushG.enemies.length > 0 && rushG.enemies.every((e) => e.speedMul >= 1.6));
  check("brawl week rotation covers all rulesets", new Set([...Array(12)].map((_, i) => brawlOf(i).id)).size === BRAWLS.length);

  // campaign missions
  const mis = (id, extra = {}) => createGame(4, { mode: "campaign", mission: id, ...extra });
  const cm1 = mis(1);
  check("campaign 1: only archers, 5 waves, spring", isLocked(cm1, 0, "cannon") && !isLocked(cm1, 0, "arrow") && cm1.winWave === 5 && cm1.season === "spring");
  const cm2 = mis(2);
  step(cm2, [{ type: "nextWave", p: 0 }]);
  for (let i = 0; i < 4000 && !cm2.over; i++) step(cm2);
  check("campaign 2: enemies trample the farm, losing it ends the game", cm2.farmMax === 40 && cm2.over && !cm2.won && (cm2.farmHp <= 0 || cm2.lives <= 0), `farm=${Math.round(cm2.farmHp)} lives=${cm2.lives}`);
  const cm8 = mis(8, { bonusGold: 5000 });
  const cf8 = free(cm8, 8);
  step(cm8, cf8.map(([tx, ty]) => ({ type: "place", kind: "arrow", tx, ty, p: 0 })));
  check("campaign 8: tower limit 6", cm8.towers.length === 6);
  const cm6 = mis(6), cd6 = createGame(4, {});
  const [cn6] = free(cm6, 1), [cn7] = free(cd6, 1);
  step(cm6, [{ type: "place", kind: "arrow", tx: cn6[0], ty: cn6[1], p: 0 }]); step(cd6, [{ type: "place", kind: "arrow", tx: cn7[0], ty: cn7[1], p: 0 }]);
  check("campaign 6: night shortens tower sight", Math.abs(towerStats(cm6, cm6.towers[0]).range / towerStats(cd6, cd6.towers[0]).range - 0.7) < 0.01);
  const cm10 = mis(10);
  cm10.wave = 3; step(cm10, [{ type: "nextWave", p: 0 }]);
  check("campaign 10: a general on wave 4", cm10.queue.some((q) => q.type === "boss" && q.bk === 5));
  const cm5 = mis(5);
  check("campaign 5: circle with a low alive limit", cm5.mode === "circle" && cm5.limit === 30);
  cm1.won = true; cm1.stats = { coins: 0, leaks: 0, peak: 0, early: 1 };
  check("campaign stars: win + side + pace = 3", missionStars(cm1) === 3);
  cm1.stats.leaks = 1; cm1.stats.early = 0;
  check("campaign stars: just the win = 1", missionStars(cm1) === 1);
  const sb = createGame(5, { mode: "brawl", week: BRAWLS.findIndex((b) => b.id === "slime") });
  step(sb, [{ type: "nextWave", p: 0 }]); for (let i = 0; i < 40; i++) step(sb);
  check("regression: brawl on the circle has a real alive limit", sb.limit >= 40 && !sb.over);

  // co-op: separate wallets, talents and ownership
  const co = createGame(9, { players: 2 });
  const [c1, c2] = free(co, 2);
  step(co, [{ type: "place", kind: "cannon", tx: c1[0], ty: c1[1], p: 0 }, { type: "place", kind: "arrow", tx: c2[0], ty: c2[1], p: 1 }]);
  check("co-op: each player pays from own gold", co.players[0].gold === 70 && co.players[1].gold === 110);
  step(co, [{ type: "sell", id: co.towers[0].id, p: 1 }]);
  check("co-op: cannot sell partner tower", co.towers.length === 2);
  // talents come from boss kills: spawn a boss and finish it off
  step(co, [{ type: "nextWave", p: 0 }]);
  co.queue = [{ type: "boss", lane: 0, at: co.tick + 1, hpMul: 0.01 }];
  for (let i = 0; i < 4000 && !co.players[0].drafts.length; i++) step(co);
  check("co-op: a boss kill gives both players their own talent draft", co.players.every((q) => q.drafts.length === 1));
  check("talents: boss draft contains a rare card", co.players.every((q) => q.drafts[0].some((id) => CARDS.find((c) => c.id === id).rarity === "rare")));
  step(co, [{ type: "pick", index: 0, p: 1 }]);
  check("co-op: picking a talent is personal", co.players[1].drafts.length === 0 && co.players[0].drafts.length === 1);

  // ---------- talent tree (src/meta.js) ----------
  const metaAt = (xp) => { const m = Meta.newMeta(); m.xp = xp; return m; };
  check('levels: 10 XP = level 1, 23 = level 2, cap 25', Meta.levelOf(9) === 0 && Meta.levelOf(10) === 1 && Meta.levelOf(23) === 2 && Meta.levelOf(1e9) === 25);
  check('levels: levelCost(n) = 10 + 3n', Meta.levelCost(0) === 10 && Meta.levelCost(1) === 13 && Meta.levelCost(2) === 16);
  const tm = metaAt(Meta.xpForLevel(5));
  check('points: one per level', Meta.points(tm) === 5);
  for (let i = 0; i < 3; i++) Meta.buy(tm, 'a1');
  check('tier gating: tier 2 opens after 3 points in tier 1', Meta.canBuy(tm, 'a4') && !Meta.canBuy(metaAt(Meta.xpForLevel(5)), 'a4'));
  Meta.buy(tm, 'a4');
  check('refund: a tier-1 rank that would close tier 2 is locked', !Meta.canRefund(tm, 'a1'));
  check('refund: a free rank from the top tier comes back', Meta.refund(tm, 'a4') && Meta.rankOf(tm, 'a4') === 0 && Meta.points(tm) === 2);
  Meta.resetBuild(tm);
  check('reset: every point of the build comes back', Meta.points(tm) === 5);
  const kt = metaAt(Meta.xpForLevel(25));
  kt.builds[0].tree = { a1: 3, a2: 2, a3: 2, a4: 2, a5: 1, m1: 3, m2: 2, m3: 2, m4: 2, m5: 1 };
  Meta.buy(kt, 'k_focus');
  check('keystones: Фокус and Вільна рука are exclusive', !Meta.canBuy(kt, 'k_hand'));
  check('keystones: at most 2 per build', !Meta.treeValid({ k_focus: 1, k_vortex: 1, k_forge: 1 }, 99));
  check('keystones: a build cannot spend more than its level', !Meta.treeValid({ a1: 3, a2: 2, a3: 2, a4: 2, a5: 1, m1: 3, m2: 2, m3: 2, m4: 2, m5: 1, k_hand: 1 }, 20));
  check('builds: 2nd opens at level 10, 3rd at level 20', Meta.buildsOpen(9) === 1 && Meta.buildsOpen(10) === 2 && Meta.buildsOpen(20) === 3);
  const two = metaAt(Meta.xpForLevel(10));
  check('builds: a closed build cannot be selected', !Meta.setActive(metaAt(Meta.xpForLevel(9)), 1));
  Meta.setActive(two, 1);
  check('builds: each build has its own points', Meta.points(two) === 10);
  Meta.buy(two, 'a1');
  Meta.setActive(two, 0);
  check('builds: points spent in one build do not show in another', Meta.rankOf(two, 'a1') === 0);
  check('unlocks: tesla from level 3, fire from level 6', Meta.perks(metaAt(Meta.xpForLevel(2))).locked.join() === 'tesla,fire' && Meta.perks(metaAt(Meta.xpForLevel(3))).locked.join() === 'fire' && Meta.perks(metaAt(Meta.xpForLevel(6))).locked.length === 0);
  check('loadout: default meteor / nova / wall on Q / W / E', Meta.perks(metaAt(Meta.xpForLevel(5))).abilities.join() === 'meteor,nova,wall');
  const ap = metaAt(Meta.xpForLevel(25));
  ap.builds[0].tree = { a1: 3, a2: 2, a3: 2, a4: 2, a5: 1, k_focus: 1 };
  check('Фокус: 2 slots and cooldowns x0.6', Meta.perks(ap).abilities.length === 2 && Math.abs(Meta.perks(ap).cdAll - 0.6) < 1e-9);
  ap.builds[0].tree = { m1: 3, m2: 2, m3: 2, m4: 2, m5: 1, k_hand: 1, g1: 1 };
  check('Вільна рука: 4 slots, R empty until something is put there', Meta.perks(ap).abilities.length === 4 && Meta.perks(ap).abilities[3] === null);
  Meta.setSlot(ap, 3, 'goldrain');
  check('an ability is only put in a slot if the tree unlocked it', Meta.perks(ap).abilities[3] === null);
  ap.builds[0].tree = { m1: 3, m2: 2, m3: 2, m4: 2, m5: 1, k_hand: 1, g1: 1, g5: 1 };
  Meta.setSlot(ap, 3, 'goldrain');
  check('tree-unlocked ability goes into its slot', Meta.perks(ap).abilities[3] === 'goldrain');
  Meta.setSlot(ap, 0, 'goldrain');
  check('slot swap: the ability moves, the other one goes back', ap.builds[0].slots[0] === 'goldrain' && ap.builds[0].slots[3] === 'meteor');
  const old = { xp: 50, tree: { a1: 2, t0: 1 }, best: {}, wins: {}, runs: 3 };
  check('migration: spent tree XP is refunded (50 + 35 + 15 = 100 → level 5)', Meta.migrateLegacy(old).xp === 100 && Meta.levelOf(100) === 5);

  // ---------- abilities: loadout gating, Overdrive, Gold Rain, Quake, Focus ----------
  const ng = createGame(4, { perks: [{ abilities: ['meteor', 'nova', 'wall'] }] });
  step(ng, [{ type: 'quake', x: 100, y: 100, p: 0 }]);
  check('ability not in the loadout cannot be cast', !ng.events.some((e) => e.type === 'quake') && ng.players[0].cds.quake === 0);
  const od = createGame(6, { perks: [{ abilities: ['overdrive'] }] });
  const [odx, ody] = free(od, 1)[0];
  step(od, [{ type: 'place', kind: 'arrow', tx: odx, ty: ody, p: 0 }]);
  const odt = od.towers[0];
  const period0 = towerStats(od, odt).period;
  step(od, [{ type: 'overdrive', p: 0 }]);
  check('overdrive: towers fire faster while it lasts', towerStats(od, odt).period < period0, `${period0} -> ${towerStats(od, odt).period}`);
  step(od, [{ type: 'overdrive', p: 0 }]);
  check('overdrive: cooldown blocks a second cast', od.events.filter((e) => e.type === 'overdrive').length === 0);
  for (let i = 0; i < 6 * 20 + 2; i++) step(od);
  check('overdrive: ends after 6 s', od.players[0].overT === 0 && towerStats(od, odt).period === period0);
  const gr = createGame(8, { perks: [{ abilities: ['goldrain'] }] });
  const coinsBefore = gr.coins.length, grGold0 = gr.players[0].gold;
  step(gr, [{ type: 'goldrain', x: 200, y: 120, p: 0 }]);
  const rained = gr.coins.slice(coinsBefore);
  check('goldrain: 5 coins land inside the radius', rained.length === ABILITIES.goldrain.coins && rained.every((c) => Math.hypot(c.x - 200, c.y - 120) <= ABILITIES.goldrain.radius + 0.01));
  step(gr, [{ type: 'collect', id: rained[0].id, p: 0 }]);
  check('goldrain: a collected coin pays out', gr.players[0].gold === grGold0 + rained[0].value);
  const qk = createGame(9, { perks: [{ abilities: ['quake'] }] });
  step(qk, [{ type: 'nextWave', p: 0 }]);
  for (let i = 0; i < 90; i++) step(qk);
  const quakeTarget = qk.enemies.find((e) => !e.dead);
  if (quakeTarget) {
    const hp0 = quakeTarget.hp;
    step(qk, [{ type: 'quake', x: quakeTarget.x, y: quakeTarget.y, p: 0 }]);
    check('quake: damage and slow inside the area', quakeTarget.hp < hp0 && quakeTarget.slowF === ABILITIES.quake.slowF && quakeTarget.slowT > 0);
  } else check('quake: damage and slow inside the area', false, 'no enemy to test on');
  const fk = createGame(10, { perks: [{ abilities: ['meteor', 'nova'], cdAll: 0.6 }] });
  check('Focus cooldowns: meteor 30 s x 0.6', abilityMax(fk, 'meteor', 0) === Math.round(30 * 0.6 * 20));

  // ---------- tree effects reach the simulation ----------
  const tfx = createGame(11, { perks: [{ discount: { all: 0.1 }, sell: 0.2, wage: 12, multi: { arrow: 1 }, steamR: 1.5, wetChain: 1, novaFreeze: 1, meteorDmg: 1.25, wallCd: 0.8, overSec: 2, dmgAll: 1.1 }] });
  check('tree: discount on every tower (arrow 50 → 45)', placeCost(tfx, 0, 'arrow') === 45);
  check('tree: sell ratio 0.9 for the owner', Math.abs(sellRatioOf(tfx, 0) - 0.9) < 1e-9);
  const mm = tfx.players[0].mods;
  check('tree: steam radius, wet chain, freeze, meteor, wall, overdrive, damage read by the sim', mm.steamR === 1.5 && mm.wetChain === 1 && mm.novaFreeze === 1 && mm.meteorDmg === 1.25 && mm.wallCd === 0.8 && mm.overSec === 2 && Math.abs(mm.dmg.arrow - 1.1) < 1e-9);
  const wg = tfx.players[0].gold;
  step(tfx, [{ type: 'nextWave', p: 0 }]);
  check('tree: wage paid at each wave start', tfx.players[0].gold === wg + 12);
  // Подвійний залп: one arrow shot targets two enemies at once
  const ml = createGame(12, { perks: [{ multi: { arrow: 1 } }], bonusGold: 500 });
  const mid = posAt(ml.map, 0, 60);
  let spot = null;
  for (let ty = 0; ty < ROWS && !spot; ty++) for (let tx = 0; tx < COLS && !spot; tx++) {
    if (canPlace(ml, tx, ty) && Math.hypot(tx * 24 + 12 - mid.x, ty * 24 + 12 - mid.y) < 40) spot = [tx, ty];
  }
  step(ml, [{ type: 'place', kind: 'arrow', tx: spot[0], ty: spot[1], p: 0 }]);
  ml.queue = [{ type: 'slime', lane: 0, at: ml.tick + 1, hpMul: 1 }, { type: 'slime', lane: 0, at: ml.tick + 1, hpMul: 1 }];
  let firstShot = 0;
  for (let i = 0; i < 400 && !firstShot; i++) { step(ml); if (ml.projs.length) firstShot = ml.projs.length; }
  check('Подвійний залп: one arrow shot targets two enemies', firstShot === 2, `projs=${firstShot}`);

  log('');
  log('Balance bot (seed, wave reached, lanes, towers):');
  for (const seed of [1, 2, 3, 4, 5, 6, 7, 8]) {
    const { s } = runBot(seed, 25);
    const c = runBot(seed, 25, { mode: "circle" }).s;
    const evo = s.towers.filter((t) => TOWERS[t.kind].from).map((t) => t.kind).join(',');
    log(`  seed ${seed}: wave ${s.wave}${s.won ? ' (WON)' : s.over ? ' (lost)' : ''} lanes ${s.map.lanes.length} kills ${s.kills} towers ${s.towers.length} evo [${evo}] | circle: wave ${c.wave}${c.won ? " (WON)" : ""}`);
  }
} catch (e) {
  failed++;
  log('ERROR ' + e.stack);
}
log('');
log(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = lines.join('\n');
</script>
