import * as Meta from '../src/meta.js';

import { VERSION, BOSSES, BOSS_POOL, CAMPAIGN, ROTATION, CONFIG } from '../src/sim/data.js';
const CAMPAIGN_NPC = CAMPAIGN.find((m) => m.id === 7).npc;
Meta.setPersist(false); // tests never write the player's real save

const lines = [];
let failed = 0;
const log = (s) => lines.push(s);
const check = (name, ok, extra = '') => { if (!ok) failed++; log(`${ok ? 'PASS' : 'FAIL'} ${name} ${extra}`); };

// Free tiles sorted by how much road is within 3 tiles.
function spots(s) {
  const road = [...s.map.tiles].map((k) => k.split(',').map(Number));
  const out = [];
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    if (!canPlace(s, tx, ty)) continue;
    out.push({ tx, ty, n: road.filter(([x, y]) => Math.hypot(x - tx, y - ty) <= 3).length });
  }
  return out.sort((a, b) => b.n - a.n);
}
const free = (s, n) => spots(s).slice(0, n).map((p) => [p.tx, p.ty]);

// Simple bot: cycles tower types, upgrades/evolves when rich, picks first card, uses abilities.
function runBot(seed, maxWaves, opts = {}) {
  const s = createGame(seed, opts);
  const pl = s.players[0];
  const SP = spots(s);
  let i = 0, guard = 0;
  const hashes = [];
  const seen = new Set(), news = [];
  while (!s.over && s.wave <= maxWaves && guard++ < 200000) {
    const cmds = [];
    if (s.players[0].drafts.length) cmds.push({ type: "pick", index: 0 });
    const kind = TOWER_ORDER[i % TOWER_ORDER.length];
    const spot = SP.find((p) => canPlace(s, p.tx, p.ty));
    if (spot && pl.gold >= TOWERS[kind].cost) { cmds.push({ type: 'place', kind, tx: spot.tx, ty: spot.ty }); i++; }
    else if (pl.gold > 250) {
      const e = s.towers.find(canEvolve);
      const t = s.towers.find((t) => t.level < 3 && !TOWERS[t.kind].from);
      const mt = s.towers.find((k) => canMaster(k) && pl.gold >= 400);
      if (e) cmds.push({ type: 'evolve', id: e.id, kind: BRANCHES[e.kind][e.id % 2] });
      else if (mt) cmds.push({ type: 'master', id: mt.id });
      else if (t) cmds.push({ type: 'upgrade', id: t.id });
    }
    if (s.enemies.length > 4) {
      const lead = s.enemies.reduce((a, b) => (a.dist > b.dist ? a : b));
      if (pl.cds.meteor === 0) cmds.push({ type: 'meteor', x: lead.x, y: lead.y });
      if (pl.cds.nova === 0) cmds.push({ type: 'nova' });
    }
    step(s, cmds);
    for (const e of s.enemies) seen.add(e.type);
    for (const ev of s.events) if (ev.type === 'newEnemy') news.push(ev.kind + '@' + ev.wave);
    if (s.tick % 100 === 0) hashes.push(`${s.tick}:${pl.gold}:${s.lives}:${s.enemies.length}:${s.enemies.reduce((a, e) => a + e.hp + e.dist, 0).toFixed(3)}`);
  }
  return { s, hash: hashes.join('|'), seen, news };
}

try {
  const a = runBot(12345, 12), b = runBot(12345, 12), c = runBot(999, 12);
  check('determinism (same seed = same run)', a.hash === b.hash && a.hash.length > 0);
  check('different seed differs', a.hash !== c.hash);

  // map generation sanity over many seeds
  let lanesOk = true, objOk = true, msg = '';
  for (let seed = 1; seed <= 200; seed++) {
    const m = createGame(seed);
    for (let l = 0; l < m.map.lanes.length; l++) {
      const L = m.map.lanes[l];
      const end = posAt(m.map, l, L.total + 1);
      const [cx, cy] = m.map.castle;
      if (L.total < 300 || Math.abs(end.x - (cx * 24 + 12)) > 1 || Math.abs(end.y - (cy * 24 + 12)) > 1) { lanesOk = false; msg = `seed ${seed} lane ${l}`; }
    }
    if (m.barrels.length < 3 || m.obstacles.length < 20) { objOk = false; msg = `seed ${seed} barrels ${m.barrels.length}`; }
    if ([...m.map.water].some((k) => m.map.tiles.has(k))) { objOk = false; msg = `seed ${seed} water on road`; }
  }
  check('200 maps: every lane reaches the castle', lanesOk, msg);
  check('200 maps: barrels/obstacles placed, no water on road', objOk, msg);

  const g = createGame(1);
  const [rx, ry] = [...g.map.tiles][3].split(',').map(Number);
  step(g, [{ type: 'place', kind: 'arrow', tx: rx, ty: ry }]);
  check('cannot build on road', g.towers.length === 0);
  const h = createGame(1, { locked: ['tesla'] });
  step(h, [{ type: 'place', kind: 'tesla', tx: free(h, 1)[0][0], ty: free(h, 1)[0][1] }]);
  check('locked tower cannot be built', h.towers.length === 0);
  step(g, free(g, 2).map(([tx, ty]) => ({ type: 'place', kind: 'cannon', tx, ty })));
  check('gold limits building', g.towers.length === 1 && g.players[0].gold === 160 - 90, `gold=${g.players[0].gold}`);

  const ev = createGame(3, { bonusGold: 2000 });
  const [ax, ay] = free(ev, 1)[0];
  step(ev, [{ type: 'place', kind: 'arrow', tx: ax, ty: ay }]);
  const tw = ev.towers[0];
  step(ev, [{ type: 'evolve', id: tw.id, kind: 'sniper' }]);
  check('cannot evolve before level 3', tw.kind === 'arrow');
  step(ev, [{ type: 'upgrade', id: tw.id }, { type: 'upgrade', id: tw.id }, { type: 'evolve', id: tw.id, kind: 'mortar' }]);
  check('cannot evolve into other family', tw.kind === 'arrow' && tw.level === 3);
  step(ev, [{ type: 'evolve', id: tw.id, kind: 'sniper' }]);
  check('evolve to sniper', tw.kind === 'sniper');
  const ob = ev.obstacles[0], g0 = ev.players[0].gold;
  step(ev, [{ type: 'clear', id: ob.id }]);
  check('clear obstacle', !ev.obstacles.includes(ob) && ev.players[0].gold === g0 - (ob.kind === 'tree' ? 15 : 25) + (ob.chest ? 45 : 0));
  step(ev, [{ type: 'barrel', id: 1 }, { type: 'barrel', id: 1 }]);
  check('barrel used once per wave', !ev.barrels[0].ready && ev.events.filter((e) => e.type === 'barrel').length === 1);

  // abilities + smite + barricade
  const ab = createGame(7);
  step(ab, [{ type: 'nextWave' }]);
  for (let i = 0; i < 60; i++) step(ab);
  const tgt = ab.enemies[0];
  const hp0 = tgt.hp;



  step(ab, [{ type: 'nova' }]);
  check('nova freezes everyone', ab.enemies.every((e) => e.slowF === 0 && e.wetT > 0) && ab.players[0].cds.nova > 0);
  step(ab, [{ type: 'nova' }]);
  check('nova respects cooldown', ab.events.filter((e) => e.type === 'nova').length === 0);
  const lead = ab.enemies.reduce((p, q) => (p.dist > q.dist ? p : q));
  const ahead = posAt(ab.map, lead.lane, lead.dist + 30);
  const wt = [Math.floor(ahead.x / 24), Math.floor(ahead.y / 24)];
  step(ab, [{ type: 'wall', tx: wt[0], ty: wt[1] }]);
  check('wall placed on road', ab.walls.length === 1 && isRoad(ab, wt[0], wt[1]));
  for (let i = 0; i < 120; i++) step(ab);
  check('wall blocks / takes damage', ab.walls.length === 0 || ab.walls[0].hp < ab.walls[0].max || ab.enemies.some((e) => e.blocked));

  // circle mode: one looping lane, enemies never leak, overflow = defeat
  let loopOk = true;
  for (let seed = 1; seed <= 100; seed++) {
    const cm = createGame(seed, { mode: "circle" });
    const L = cm.map.lanes[0];
    const a = posAt(cm.map, 0, L.loopStart + 5), b = posAt(cm.map, 0, L.loopStart + L.loopLen + 5);
    if (!L.loop || cm.map.lanes.length !== 1 || Math.abs(a.x - b.x) > 0.01 || Math.abs(a.y - b.y) > 0.01) loopOk = false;
  }
  check("100 circle maps: closed loop", loopOk);
  const ci = createGame(5, { mode: "circle" });
  step(ci, [{ type: "nextWave", p: 0 }]);
  for (let i = 0; i < 1500; i++) step(ci);
  check("circle: enemies loop instead of leaking", ci.lives === 20 && ci.enemies.some((e) => e.lap >= 1), `alive=${ci.enemies.length}`);
  ci.limit = ci.enemies.length;
  step(ci);
  check("circle: too many alive = defeat", ci.over && !ci.won);

  // circle with two players: second entry from the right, both closed loops, waves use both, no barrels
  let twoOk = true, twoMsg = "";
  for (let seed = 1; seed <= 100; seed++) {
    const c2 = createGame(seed, { mode: "circle", players: 2 });
    if (c2.map.lanes.length !== 2 || c2.barrels.length) { twoOk = false; twoMsg = `seed ${seed}`; continue; }
    for (let l = 0; l < 2; l++) {
      const L = c2.map.lanes[l];
      const a = posAt(c2.map, l, L.loopStart + 3), b = posAt(c2.map, l, L.loopStart + L.loopLen + 3);
      if (Math.abs(a.x - b.x) > 0.01 || Math.abs(a.y - b.y) > 0.01) { twoOk = false; twoMsg = `seed ${seed} lane ${l}`; }
    }
    if (c2.map.lanes[1].points[0][0] !== 26) { twoOk = false; twoMsg = `seed ${seed} entry`; }
  }
  check("100 circle 2p maps: two closed entries (left + right), no barrels", twoOk, twoMsg);
  const w2 = createGame(3, { mode: "circle", players: 2 });
  step(w2, [{ type: "nextWave", p: 0 }]);
  check("circle 2p: wave comes from both spawns", new Set(w2.queue.map((q) => q.lane)).size === 2);

  // tower relocation: range, cooldown, ownership
  const mv = createGame(11, { players: 2 });
  const [m1] = free(mv, 1);
  step(mv, [{ type: "place", kind: "arrow", tx: m1[0], ty: m1[1], p: 0 }]);
  const mt = mv.towers[0];
  let far = null, near = null;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    if (!canPlace(mv, tx, ty)) continue;
    const d = Math.hypot(tx - mt.tx, ty - mt.ty);
    if (d > 10 && !far) far = [tx, ty];
    if (d <= 10 && d >= 2 && !near) near = [tx, ty];
  }
  if (far) { step(mv, [{ type: "move", id: mt.id, tx: far[0], ty: far[1], p: 0 }]); }
  check("move: not farther than 10 tiles", !far || (mt.tx === m1[0] && mt.ty === m1[1]));
  step(mv, [{ type: "move", id: mt.id, tx: near[0], ty: near[1], p: 1 }]);
  check("move: cannot move partner tower", mt.tx === m1[0] && mt.ty === m1[1]);
  step(mv, [{ type: "move", id: mt.id, tx: near[0], ty: near[1], p: 0 }]);
  check("move: relocates within range, starts cooldown", mt.tx === near[0] && mt.ty === near[1] && mt.moveCd > 0 && !canPlace(mv, near[0], near[1]) && canPlace(mv, m1[0], m1[1]));
  step(mv, [{ type: "move", id: mt.id, tx: m1[0], ty: m1[1], p: 0 }]);
  check("move: cooldown blocks a second move", mt.tx === near[0]);
  for (let i = 0; i < 30 * 20; i++) step(mv);
  step(mv, [{ type: "move", id: mt.id, tx: m1[0], ty: m1[1], p: 0 }]);
  check("move: allowed again after 30 s", mt.tx === m1[0] && mt.ty === m1[1]);

  // totem auras: buff nearby towers, upgrade levels cost more each time, no stacking
  const tg = createGame(13, { bonusGold: 3000 });
  const road = [...tg.map.tiles].map((k) => k.split(",").map(Number));
  let ta = null, tb = null;
  for (let ty = 0; ty < ROWS && !tb; ty++) for (let tx = 0; tx < COLS - 1 && !tb; tx++) {
    if (canPlace(tg, tx, ty) && canPlace(tg, tx + 1, ty)) { ta = [tx, ty]; tb = [tx + 1, ty]; }
  }
  step(tg, [{ type: "place", kind: "arrow", tx: ta[0], ty: ta[1], p: 0 }, { type: "place", kind: "totem", tx: tb[0], ty: tb[1], p: 0 }]);
  const [archer, totem] = tg.towers;
  const base = towerStats(tg, archer);
  const g1 = tg.players[0].gold;
  step(tg, [{ type: "aura", id: totem.id, aura: "dmg", p: 0 }, { type: "aura", id: totem.id, aura: "dmg", p: 0 }, { type: "aura", id: totem.id, aura: "rate", p: 0 }]);
  const buffed = towerStats(tg, archer);
  check("totem: auras raise damage and attack speed of neighbours", buffed.dmg > base.dmg * 1.19 && buffed.period < base.period, `dmg ${base.dmg}->${buffed.dmg}`);
  check("totem: aura levels get pricier (60+110+60)", g1 - tg.players[0].gold === 230);
  step(tg, [{ type: "aura", id: totem.id, aura: "dmg", p: 0 }, { type: "aura", id: totem.id, aura: "dmg", p: 0 }]);
  check("totem: max 3 aura levels", totem.aura.dmg === 3);
  check("totem: never shoots, cannot evolve", !canEvolve(totem) && towerStats(tg, totem).dmg === 0);
  void road;

  // barricade: one standing wall per player
  const bw = createGame(7);
  const rt = [...bw.map.tiles].map((k) => k.split(",").map(Number)).filter(([x]) => x >= 0);
  step(bw, [{ type: "wall", tx: rt[2][0], ty: rt[2][1], p: 0 }]);
  bw.players[0].cds.wall = 0;
  step(bw, [{ type: "wall", tx: rt[6][0], ty: rt[6][1], p: 0 }]);
  check("barricade: only one standing per player", bw.walls.length === 1);

  // circle win: wave 20 out and its bosses dead is enough, leftover small enemies do not block the choice
  const cw = createGame(31, { mode: "circle" });
  cw.wave = 19;
  cw.limit = 1e9; // no towers in this test: do not lose to overflow first
  step(cw, [{ type: "nextWave", p: 0 }]);
  for (let i = 0; i < 6000 && !cw.over; i++) {
    step(cw);
    for (const e of cw.enemies) if (e.type === "king") e.hp = 0, e.dead = true;
  }
  check("circle: victory offered after wave 20 bosses die even with enemies left", cw.won && cw.over && cw.wave === 20, `won=${cw.won} alive=${cw.enemies.length}`);

  // endless circle: continue after the win, waves go past 20 with more bosses
  const en = createGame(21, { mode: "circle" });
  en.wave = 20; en.won = true; en.over = true;
  step(en, [{ type: "continue", p: 0 }]);
  check("endless: continue reopens the run", !en.over && en.endless && !en.won);
  step(en, [{ type: "nextWave", p: 0 }]);
  step(en, [{ type: "nextWave", p: 0 }]);
  while (en.queue.length) { en.queue = en.queue.filter((q) => false); }
  step(en, [{ type: "nextWave", p: 0 }]);
  check("endless: waves keep coming past 20", en.wave === 21 || en.wave > 20);
  const en2 = createGame(21, { mode: "circle" });
  en2.wave = 21; en2.endless = true;
  step(en2, [{ type: "nextWave", p: 0 }]);
  const bosses = en2.queue.filter((q) => q.type === "boss" || q.type === "king").length;
  check("endless: boss waves every 2 waves after 20", en2.wave === 22 && bosses >= 1, `bosses=${bosses}`);

  // tower vs enemy type
  check("enemy types: runner weak to arrows, resists cannons", vsMult("runner", "arrow") > 1 && vsMult("runner", "cannon") < 1 && vsMult("runner", null) === 1);

  // talents: mode pools, per-player max, rarity weighting
  const offered = { classic: new Set(), circle: new Set() };
  let rare = 0, total = 0, maxOk = true;
  for (const md of ["classic", "circle"]) {
    for (let seed = 1; seed <= 40; seed++) {
      const tg2 = createGame(seed, { mode: md });
      const pl2 = tg2.players[0];
      for (let w = 0; w < 19; w++) {
        const d = pickCards(tg2, 3, pl2, w % 2 === 0);
        pl2.drafts.push(d);
        for (const id of d) {
          offered[md].add(id);
          const card = CARDS.find((c) => c.id === id);
          total++; if (card.rarity !== "common") rare++;
          if ((pl2.picked[id] || 0) >= card.max) maxOk = false;
        }
        step(tg2, [{ type: "pick", index: 0, p: 0 }]);
      }
    }
  }
  const only = (md) => CARDS.filter((c) => c.modes && !c.modes.includes(md)).map((c) => c.id);
  check("talents: classic never offers circle-only cards", only("classic").every((id) => !offered.classic.has(id)), [...offered.classic].join(","));
  check("talents: circle never offers classic-only cards", only("circle").every((id) => !offered.circle.has(id)));
  check("talents: mode cards do appear in their mode", offered.classic.has("walls") && offered.circle.has("dam"));
  check("talents: a card is never offered past its max", maxOk);
  check("talents: rare+epic cards are rarer than common", rare / total > 0.15 && rare / total < 0.65, `rare ${Math.round(100 * rare / total)}%`);

  // bosses: one per player, arriving right after the announcement
  for (const md of ["classic", "circle"]) for (const np of [1, 2]) {
    const bs = createGame(77, { mode: md, players: np });
    bs.wave = 4;
    step(bs, [{ type: "nextWave", p: 0 }]);
    let first = -1, count = 0;
    for (let i = 0; i < 200; i++) { step(bs); for (const e of bs.events) if (e.type === "bossSpawn") { count++; if (first < 0) first = i; } }
    check(`bosses: ${md} with ${np} player(s) -> ${np} boss(es) within 5 s`, count === np && first >= 0 && first < 100, `count=${count} first=${first}`);
  }

  // run summary / bestiary: a boss death names the boss (bk) and the killing tower family (by)
  {
    const bs = createGame(77, { mode: "classic", players: 1 });
    bs.wave = 4;
    step(bs, [{ type: "nextWave", p: 0 }]);
    let boss = null;
    for (let i = 0; i < 200 && !boss; i++) { step(bs); boss = bs.enemies.find((e) => e.bk !== undefined); }
    bs.events = [];
    if (boss) kill(bs, boss, 0, "arrow");
    const d = bs.events.find((e) => e.type === "death");
    check("bestiary: boss death event carries bk and by", !!d && d.bk === boss.bk && BOSSES[d.bk] && d.by === "arrow", JSON.stringify(d && { bk: d.bk, by: d.by }));
    const m = Meta.newMeta();
    const r1 = Meta.recordBosses(m, { bossesSeen: ["kvak", "rat"], bossesKilled: ["kvak"] }, "normal");
    const r2 = Meta.recordBosses(m, { bossesSeen: ["kvak"], bossesKilled: ["kvak"] }, "nightmare");
    const k = Meta.bossEntry(m, "kvak");
    // every boss has a bestiary blurb
    check("bestiary: every boss has an about text", Object.values(BOSSES).every((b) => typeof b.about === "string" && b.about.length > 20));
    check("bestiary: seen / killed / medal recorded", r1.seen.length === 2 && r1.killed[0] === "kvak" && !r2.killed.length && r2.medal[0] === "kvak" && k.seen === 2 && k.kills === 2 && k.best === 2 && Meta.bossEntry(m, "rat").kills === 0, JSON.stringify({ r1, r2, k }));
  }

  // new bosses: Нічна Мара, Пан Равлик, Вихор, Перевертень
  {
    const withBoss = (bk, mode = "classic") => {
      const g = createGame(5, { mode, players: 1 });
      g.wave = 5;
      g.queue.push({ type: "boss", bk, lane: 0, at: g.tick + 1, hpMul: 1 });
      step(g); step(g);
      return { g, b: g.enemies.find((e) => e.bk === bk) };
    };
    // Нічна Мара: night while she lives; fire towers light themselves and their neighbours
    {
      const { g, b } = withBoss("mara");
      const far = { kind: "arrow", tx: 0, ty: 0 }, near = { kind: "arrow", tx: 10, ty: 5 };
      g.towers.push({ kind: "fire", tx: 11, ty: 5 });
      const ok = !!b && g.dark && dayPhase(g) === 2 && nightSight(g, far) === BOSSES.mara.skill.sight && nightSight(g, near) === 1;
      kill(g, b, 0); step(g);
      check("boss mara: night while alive, fire lights neighbours, day back after death", ok && !g.dark, `dark=${g.dark}`);
    }
    // Пан Равлик: enemies on the slime road behind him speed up, the ones ahead do not
    {
      const { g, b } = withBoss("ravlyk");
      for (let i = 0; i < 200 && b.dist < 90; i++) step(g);
      const behind = spawn(g, "slime", b.lane, b.dist - 40, 1), ahead = spawn(g, "slime", b.lane, b.dist + 40, 1);
      for (let i = 0; i < 6; i++) step(g);
      check("boss ravlyk: slime trail hastes the enemies behind him", behind.hasteT > 0 && behind.hasteF === BOSSES.ravlyk.skill.mult && !(ahead.hasteT > 0), `behind=${behind.hasteT}/${behind.hasteF} ahead=${ahead.hasteT}`);
    }
    // Вихор: circle only; turns the ring back, and forward again when he dies
    {
      const g = createGame(1, { mode: "classic", players: 1 });
      const drawn = [];
      for (let i = 0; i < 25; i++) { g.wave = 4; g.queue = []; step(g, [{ type: "nextWave", p: 0 }]); drawn.push(...g.queue.filter((q) => q.bk !== undefined).map((q) => q.bk)); }
      check("boss vyhor: never drawn outside the circle", drawn.length >= 20 && !drawn.includes("vyhor"), drawn.join(","));
      const { g: c, b } = withBoss("vyhor", "circle");
      const L = c.map.lanes[b.lane];
      const sl = spawn(c, "slime", b.lane, L.loopStart + 60, 1);
      b.abT = 1; step(c);
      const d0 = sl.dist; step(c); step(c);
      const back = c.ringRev && sl.dist < d0;
      kill(c, b, 0); step(c);
      const d1 = sl.dist; step(c);
      check("boss vyhor: ring walks backwards, forward again after his death", back && !c.ringRev && sl.dist > d1, `rev=${c.ringRev} ${d0}->${sl.dist}`);
    }
    // Перевертень: walks in as a slime inside a slime pack, unmasks on the first hit
    {
      const g = createGame(5, { mode: "classic", players: 1 });
      g.wave = 5;
      g.queue.push({ type: "boss", bk: "pere", lane: 0, at: g.tick + 1, hpMul: 1 });
      step(g);
      const sp = g.events.find((e) => e.type === "bossSpawn");
      const b = g.enemies.find((e) => e.bk === "pere");
      const pack = g.enemies.filter((e) => e.type === "slime").length;
      const slowSpeed = b.speedMul;
      g.events = [];

      damage(g, p, 9999, 0, { src: 'arrow' });
      for (let i = 0; i < 3; i++) step(g);
      check('rally: a boss heal does not lift a heap of bones (hp stays 1)', p.pile > 0 && p.hp === 1 && g.events.length >= 0, `hp=${p.hp}`);
      const b = arena(26), bb = put(b, 'bonepile', 120, 10);
      bb.hp = 1; bb.burnT = 1; bb.burnDps = 100; bb.burnOwner = 0; bb.burnSrc = 'fire';
      step(b);
      check('bonepile: killed by the LAST burn tick does not rise', bb.dead);
      const c = arena(26), cb = put(c, 'bonepile', 120, 10);
      cb.hp = 1; cb.sporeT = 1; cb.sporeDps = 100; cb.sporeOwner = 0; cb.sporeCfg = TOWERS.spore.spore;
      step(c);
      check('bonepile: killed by the LAST spore tick does not rise', cb.dead);
    }
    // 6. Мошкара: three at once, fly, cost per group, cannon x0.5
    {
      const d = ENEMIES.gnats;
      check('gnats: count 3, fly, vs fire 1.5 / tesla 1.3 / cannon 0.5', d.count === 3 && d.flying && vsMult('gnats', 'fire') === 1.5 && vsMult('gnats', 'tesla') === 1.3 && vsMult('gnats', 'cannon') === 0.5);
      const g = createGame(3); g.rot = [{ wave: 1, type: 'gnats' }]; g.lives = 1e6;
      let units = 0, groupsOk = true;
      for (let i = 0; i < 20; i++) {
        g.wave = 0; g.queue = []; step(g, [{ type: 'nextWave', p: 0 }]);
        const gn = g.queue.filter((q) => q.type === 'gnats');
        units += gn.length;
        if (gn.length % 3 !== 0) groupsOk = false;
        const slimes = g.queue.filter((q) => q.type === 'slime').length;
        if (gn.length / 3 * d.cost + slimes * ENEMIES.slime.cost > 14 + 3) groupsOk = false; // cost is per group, within the budget
      }
      check('gnats: always arrive in threes, cost counted per group', units > 0 && groupsOk, `units=${units}`);
      const fl = arena(23), fg = spawn(fl, 'gnats', 0, 40, 1), sl = spawn(fl, 'slime', 0, 40, 1);
      const P = posAt(fl.map, 0, 70);
      fl.walls.push({ id: 997, owner: 0, tx: 0, ty: 0, x: P.x, y: P.y, hp: 1e6, max: 1e6 });
      for (let i = 0; i < 70; i++) step(fl);
      check('gnats: fly over the barricade', fg.dist > 90 && sl.blocked);
    }

    // 7. Сорока: collects coins within 28 px, spills them (+1 coin) when killed, loses them when she escapes
    {
      const g = arena(24), m = put(g, 'magpie', 80, 100);
      g.coins.push({ id: 5001, x: m.x + 20, y: m.y, value: 6, life: 100 }, { id: 5002, x: m.x + 60, y: m.y, value: 7, life: 100 });
      step(g);
      check('magpie: picks up a coin within 28 px, not a far one', m.loot.length === 1 && m.loot[0] === 6 && g.coins.length === 1 && g.coins[0].id === 5002);
      g.coins = [];
      kill(g, m, 0, 'arrow');
      const vals = g.coins.map((c) => c.value).sort();
      check('magpie: killed, she spills her loot plus one coin', g.coins.length >= 2 && vals.includes(6), JSON.stringify(vals));
      const e = arena(24), em = spawn(e, 'magpie', 0, 80, 1);
      em.loot.push(9, 9);
      const L = e.map.lanes[0];
      em.dist = L.total - 0.5;
      const lives = e.lives;
      step(e);
      check('magpie: escaped = the loot is gone, nothing spills', em.dead && e.coins.length === 0 && e.lives === lives - 1);
      const gc = arena(24), gm = put(gc, 'magpie', 80, 1);
      for (let i = 0; i < 12; i++) gm.loot.push(1);
      gc.coins.push({ id: 5003, x: gm.x, y: gm.y, value: 4, life: 100 });
      step(gc);
      check('magpie: carries at most 12 coins', gm.loot.length === 12 && gc.coins.length === 1);
    }

    // 9. Кістлявчик: falls into a pile (3 s, circle 2 s), gets up once with 40% hp; fire / spores / explosions stop it
    {
      const g = arena(25), b = put(g, 'bonepile', 120, 10), gold0 = g.players[0].gold;
      damage(g, b, 9999, 0, { src: 'arrow' });
      check('bonepile: death makes a pile, not a corpse (gold paid)', !b.dead && b.pile === 60 && b.hp === 1 && g.players[0].gold > gold0 && g.events.some((e) => e.type === 'pile'));
      tower(g, 'arrow', 120);
      for (let i = 0; i < 30; i++) step(g);
      check('bonepile: aimed towers cannot hit the pile', b.hp === 1 && b.pile > 0 && !b.dead);
      for (let i = 0; i < 40 && b.pile > 0; i++) step(g);
      check('bonepile: gets up after 3 s with 40% hp', b.pile === 0 && !b.dead && b.hp === Math.round(b.maxHp * 0.4), `hp ${b.hp}/${b.maxHp} tick ${g.tick}`);
      damage(g, b, 99999, 0, { pierce: true, src: 'arrow' });
      check('bonepile: gets up only once', b.dead);

      const c = arena(25, { mode: 'circle' }), cb = put(c, 'bonepile', 120, 10);
      damage(c, cb, 9999, 0, { src: 'arrow' });
      check('bonepile: in the circle the pile lasts 2 s', cb.pile === 40);

      const ar = arena(25), ap = put(ar, 'bonepile', 120, 10);
      damage(ar, ap, 9999, 0, { src: 'arrow' });
      explode(ar, ap.x, ap.y, 20, 1, 0, 'cannon');
      check('bonepile: area damage finishes the pile', ap.dead);

      const bu = arena(25), bp = put(bu, 'bonepile', 120, 10);
      ignite(bu, bp, 3, 2, 0, 'fire');
      damage(bu, bp, 9999, 0, { pierce: true, quiet: true });
      check('bonepile: dies for good while burning', bp.dead);
      const sc = arena(25), sb = put(sc, 'bonepile', 120, 10);
      infect(sc, sb, TOWERS.spore.spore, 0, 1, 0);
      damage(sc, sb, 9999, 0, { pierce: true, quiet: true });
      check('bonepile: dies for good while poisoned', sb.dead);
      const ex = arena(25), eb = put(ex, 'bonepile', 120, 1);
      explode(ex, eb.x, eb.y, 20, 9999, 0, 'cannon');
      check('bonepile: dies for good from an explosion', eb.dead);
      // a pile is not healed by a Цілитель nor counted as a target for the chain
      const hl = arena(25), hp = put(hl, 'bonepile', 120, 10); put(hl, 'healer', 125, 1);
      damage(hl, hp, 9999, 0, { src: 'arrow' });
      for (let i = 0; i < 40; i++) step(hl);
      check('bonepile: a healer does not heal the pile', hp.hp === 1 && hp.pile > 0);
    }

    // determinism of a whole run with batch-2 mobs forced into the pool, classic and circle
    {
      const forced = (mode) => {
        const g = createGame(41, { mode, bonusGold: 3000, bonusLives: 30 });
        g.rot = ['gnats', 'magpie', 'roller', 'mistling', 'bonepile'].map((type, i) => ({ wave: i + 1, type }));
        const sig = [];
        for (let i = 0; i < 20 * 150 && !g.over; i++) {
          step(g, i % 40 === 0 && g.towers.length < 6 ? [{ type: 'place', kind: ['arrow', 'cannon', 'tesla', 'fire'][g.towers.length % 4], tx: nearTile(g, 80 + g.towers.length * 30)[0], ty: nearTile(g, 80 + g.towers.length * 30)[1], p: 0 }] : []);
          if (g.tick % 100 === 0) sig.push(stateHash(g));
        }
        return { sig: sig.join(), types: new Set(g.enemies.map((e) => e.type)), wave: g.wave };
      };
      for (const md of ['classic', 'circle']) {
        const a = forced(md), b = forced(md);
        check(`batch 2 mobs in a ${md} run: deterministic, the run goes on`, a.sig === b.sig && a.sig.length > 0 && a.wave >= 3, `wave ${a.wave}`);
      }
    }
    // real «5 of 10»: each run meets five, the other five wait for the endless mode (every 2 waves after the win wave)
    {
      const sets = new Set();
      let ok = true;
      for (let seed = 1; seed <= 40; seed++) {
        const g = createGame(seed), five = g.rot.slice(0, 5), rest = g.rot.slice(5);
        sets.add(five.map((r) => r.type).sort().join());
        if (g.rot.length !== 10 || rest.some((r, i) => r.wave !== g.winWave + 2 * (i + 1)) || new Set(g.rot.map((r) => r.type)).size !== 10) ok = false;
      }
      check('rotation: 5 of 10 per run, the rest come every 2 waves after wave 20, different seeds pick different fives', ok && sets.size > 5, `${sets.size} different sets`);
    }
  }

  // Golden replay: a fixed bot run must give the same fingerprint until VERSION is bumped.
  // When you change src/sim on purpose: VERSION++ and paste the new hash printed below.
  const GOLDEN = { version: 62, hash: 2070823479 };
  const gh = stateHash(runBot(4242, 6).s);
  if (VERSION === GOLDEN.version) check('golden replay: sim unchanged at this VERSION (else bump VERSION)', gh === GOLDEN.hash, `got ${gh}`);
  else log(`NOTE golden replay: VERSION ${VERSION} — set GOLDEN = { version: ${VERSION}, hash: ${gh} }`);

  // Training dummy: one level-3 tower vs stationary enemies next to it, 20 s.
  // "crowd" = 8 slimes, "single" = one armored knight, "boss" = one boss. Damage per 100 gold spent.
  let benchRaw = 0;
  const bench = (kind, scene, master = false) => {
    const b = createGame(7, { mode: 'classic' });
    b.players[0].gold = 99999; b.queue = []; b.countdown = 1e9;
    const lane = b.map.lanes[0], mid = lane.segs[Math.floor(lane.segs.length / 2)];
    const at = mid.start + mid.len / 2, c = posAt(b.map, 0, at);
    const spot = spots(b).filter((p) => Math.hypot(p.tx * 24 + 12 - c.x, p.ty * 24 + 12 - c.y) < 40)[0];
    const base = TOWERS[kind].from || kind;
    step(b, [{ type: 'place', kind: base, tx: spot.tx, ty: spot.ty, p: 0 }]);
    const t = b.towers[0];
    step(b, [{ type: 'upgrade', id: t.id, p: 0 }]); step(b, [{ type: 'upgrade', id: t.id, p: 0 }]);
    if (kind !== base) step(b, [{ type: 'evolve', id: t.id, kind, p: 0 }]);
    if (master) step(b, [{ type: 'master', id: t.id, p: 0 }]);
    const types = scene === 'crowd' ? Array(8).fill('slime') : [scene === 'boss' ? 'boss' : 'knight'];
    const foes = types.map((ty, i) => { const e = spawnAt(b, ty, at + (i - 3.5) * 6); return e; });
    for (let i = 0; i < 400; i++) step(b);
    const dealt = foes.reduce((a, e) => a + (e.maxHp - Math.max(0, e.hp)), 0);
    benchRaw = dealt;
    return Math.round(dealt / t.spent * 100);
  };
  function spawnAt(b, type, dist) {
    b.queue.push({ type, lane: 0, at: b.tick + 1, hpMul: 1000 });
    step(b);
    const e = b.enemies[b.enemies.length - 1];
    e.dist = dist; const p = posAt(b.map, 0, dist); e.x = e.px = p.x; e.y = e.py = p.y; e.speedMul = 0;
    return e;
  }
  log('');
  log('Tower bench (damage per 100 gold over 20 s: crowd / single armored / boss):');
  const B = {};
  for (const base of Object.keys(BRANCHES)) for (const k of [base, ...BRANCHES[base]]) {
    B[k] = ['crowd', 'single', 'boss'].map((sc) => bench(k, sc));
    log(`  ${k.padEnd(9)} ${B[k].join(' / ')}`);
  }
  // A branch must not beat its sibling in every scene by a wide margin (= no real choice).
  for (const base of Object.keys(BRANCHES)) {
    const [a, b2] = BRANCHES[base];
    const dom = (x, y) => B[x].every((v, i) => v > B[y][i] * 1.25);
    check(`branches ${a}/${b2}: neither dominates in every scene`, !dom(a, b2) && !dom(b2, a), `${a}=${B[a]} ${b2}=${B[b2]}`);
  }

  // Mastery: clearly stronger in raw damage, still fair per gold (not a must-buy trap, not a waste)
  log('Mastery bench (per 100 gold crowd / single / boss, raw x vs evolution):');
  for (const base of Object.keys(BRANCHES)) for (const k of BRANCHES[base]) {
    const evo = [], mst = [], gain = [];
    for (const sc of ['crowd', 'single', 'boss']) {
      evo.push(bench(k, sc)); const r0 = benchRaw;
      mst.push(bench(k, sc, true)); gain.push(benchRaw / Math.max(1, r0));
    }
    log(`  ${(k + '♛').padEnd(10)} ${mst.join(' / ')}  raw x${gain.map((v) => v.toFixed(2)).join(' / ')}`);
    check(`mastery ${k}: +30% raw damage in its best scene`, Math.max(...gain) >= 1.3, gain.map((v) => v.toFixed(2)).join(','));
    // Frost is utility (slow/freeze): its tiny damage numbers make per-gold ratios meaningless, so only the floor applies
    if (base !== 'frost') check(`mastery ${k}: per-gold value stays within 70–150% of the evolution`, mst.every((v, i) => v >= evo[i] * 0.7 - 1) && Math.max(...mst.map((v, i) => v / Math.max(1, evo[i]))) <= 1.5, `${evo} -> ${mst}`);
  }
  // rules: only evolved towers (Totem: an aura at 3), own towers, once, costs gold, discounts apply
  const mg = createGame(3, { bonusGold: 5000, players: 2 });
  const [mx2, my2] = free(mg, 1)[0];
  step(mg, [{ type: 'place', kind: 'arrow', tx: mx2, ty: my2, p: 0 }]);
  const mt0 = mg.towers[0];
  step(mg, [{ type: 'master', id: mt0.id, p: 0 }]);
  check('mastery: not before evolution', !mt0.master);
  step(mg, [{ type: 'upgrade', id: mt0.id, p: 0 }]); step(mg, [{ type: 'upgrade', id: mt0.id, p: 0 }]); step(mg, [{ type: 'evolve', id: mt0.id, kind: 'sniper', p: 0 }]);
  const g0m = mg.players[0].gold, cost0 = masterCost(mg, 0, mt0);
  step(mg, [{ type: 'master', id: mt0.id, p: 1 }]);
  check('mastery: only the owner', !mt0.master);
  step(mg, [{ type: 'master', id: mt0.id, p: 0 }]);
  check('mastery: bought once, costs gold, stats replaced', mt0.master && mg.players[0].gold === g0m - cost0 && towerDef(mt0).dmg === 100 && towerStats(mg, mt0).range > 180);
  step(mg, [{ type: 'master', id: mt0.id, p: 0 }]);
  check('mastery: only once', mg.players[0].gold === g0m - cost0);
  CARDS.find((c) => c.id === 'workshop').apply(mg, mg.players[0]);
  check('mastery: «Майстерня» makes it cheaper', masterCost(mg, 0, { kind: 'ranger' }) < 210);
  check('mastery: tree «Майстер-зброяр» is in the tree', !!Meta.TREE.find((n) => n.id === 'g10'));
  const tmG = createGame(3, { bonusGold: 5000 });
  const [tx3, ty3] = free(tmG, 1)[0];
  step(tmG, [{ type: "place", kind: "totem", tx: tx3, ty: ty3, p: 0 }]);
  const tt = tmG.towers[0];
  step(tmG, [{ type: "master", id: tt.id, p: 0 }]);
  check('mastery: totem needs an aura at level 3', !tt.master);
  for (let i = 0; i < 3; i++) step(tmG, [{ type: "aura", id: tt.id, aura: "dmg", p: 0 }]);
  step(tmG, [{ type: "master", id: tt.id, p: 0 }]);
  check('mastery: Великий тотем — wider and stronger auras', tt.master && towerDef(tt).range === 84 && towerDef(tt).auraMul === 1.5);

  log('');
  log('Balance bot (seed, wave reached, lanes, towers):');
  for (const seed of [1, 2, 3, 4, 5, 6, 7, 8]) {
    const { s } = runBot(seed, 25);
    const c = runBot(seed, 25, { mode: "circle" }).s;
    const evo = s.towers.filter((t) => TOWERS[t.kind].from).map((t) => t.kind).join(',');
    log(`  seed ${seed}: wave ${s.wave}${s.won ? ' (WON)' : s.over ? ' (lost)' : ''} lanes ${s.map.lanes.length} kills ${s.kills} towers ${s.towers.length} evo [${evo}] | circle: wave ${c.wave}${c.won ? " (WON)" : ""}`);
  }
} catch (e) {
  failed++;
  log('ERROR ' + e.stack);
}
log('');
log(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = lines.join('\n');
</script>
