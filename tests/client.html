<!doctype html>
<meta charset="utf-8">
<title>Client smoke tests</title>
<pre id="out">running…</pre>
<iframe id="app" src="../index.html" style="width:1100px;height:700px;border:0"></iframe>
<script type="module">
// 1) pure unit tests of the network message validator and the command table
// 2) boots the real game in an iframe, walks lobby -> run -> menu -> resume and collects uncaught errors
import { validate } from '../src/client/protocol.js';
import { COMMANDS } from '../src/sim/commands.js';
import { createGame, step } from '../src/sim/sim.js';
import { SONGS, songFor, SHOTS, Sfx } from '../src/audio.js';
import { TOWERS as TW } from '../src/sim/data.js';
import { HERO, hero } from '../src/say.js';
import { CAMPAIGN as CAMP } from '../src/sim/data.js';

const lines = [];
let failed = 0;
const check = (name, ok, extra = '') => { if (!ok) failed++; lines.push(`${ok ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// ---- validator ----
HERO.name = ''; const heroDefault = hero('{hero}, будуй!'); HERO.name = 'Богдан';
check('story: {hero} becomes the nickname (Тарас without one)', heroDefault === 'Тарас, будуй!' && hero('{hero}, будуй!') === 'Богдан, будуй!');
check('story: no campaign line names Тарас directly', !JSON.stringify(CAMP.map((m) => m.story)).includes('Тарас'));
HERO.name = '';
check('sfx: every shooting tower has its own shot sound', Object.keys(TW).filter((k) => !TW[k].support).every((k) => SHOTS[k]) && new Set(Object.values(SHOTS).map((v) => JSON.stringify(v))).size === Object.keys(SHOTS).length);
{ const fx = new Sfx(); let err = ''; try { fx.ctx = new OfflineAudioContext(1, 44100, 44100); fx.noiseBuf = fx.ctx.createBuffer(1, 4410, 44100); for (const k of Object.keys(SHOTS)) fx.shot(k); } catch (e) { err = e.message; } check('sfx: every shot synthesises without errors', !err, err); }
check('music: every campaign mission has its own theme', new Set(CAMP.map((m) => songFor({ mission: m, season: m.season }))).size === CAMP.length && CAMP.every((m) => songFor({ mission: m }) === 'm' + m.id));
check('music: outside the campaign the season picks the theme', songFor({ season: 'winter' }) === 'winter' && songFor({ season: 'spring', mission: null }) === 'spring');
check('music: themes are well-formed', Object.values(SONGS).every((S) => S.bpm > 0 && S.chords.every((c) => c.length === 4) && (!S.drums || S.drums.length === 8)));
check('validate: garbage dropped', validate(null) === null && validate('x') === null && validate({}) === null && validate({ t: 'nope' }) === null);
check('validate: cmd with known type', validate({ t: 'cmd', cmd: { type: 'place', kind: 'arrow', tx: 1, ty: 2 } })?.cmd.type === 'place');
check('validate: cmd with unknown type dropped', validate({ t: 'cmd', cmd: { type: 'hack' } }) === null);
check('validate: cmd prototype keys dropped', validate({ t: 'cmd', cmd: { type: 'constructor' } }) === null && validate({ t: 'cmd', cmd: { type: '__proto__' } }) === null);
check('validate: tick needs cmds array', validate({ t: 'tick' }) === null && validate({ t: 'tick', cmds: [] })?.t === 'tick');
check('validate: hash needs integer tick and h', validate({ t: 'hash', tick: 100, h: 5 })?.h === 5 && validate({ t: 'hash', tick: 'x', h: 5 }) === null && validate({ t: 'hash', tick: 1 }) === null);
check('validate: desync', validate({ t: 'desync', tick: 200 })?.tick === 200 && validate({ t: 'desync' })?.tick === 0);
check('validate: too many cmds dropped', validate({ t: 'tick', cmds: Array.from({ length: 65 }, () => ({})) }) === null);
check('validate: cursor needs finite numbers', validate({ t: 'cursor', x: NaN, y: 1 }) === null && validate({ t: 'cursor', x: 5, y: 6 })?.x === 5);
check('validate: nick truncated', validate({ t: 'hello', nick: 'x'.repeat(100), v: 1 }).nick.length === 16);
check('validate: start needs seed+opts+idx', validate({ t: 'start', seed: 1 }) === null && validate({ t: 'start', seed: 1, opts: {}, idx: 1, v: 38 })?.t === 'start');
check('validate: roster capped', validate({ t: 'roster', list: [1, 2, 3, 4, 5] }) === null);

// ---- command table: every handler exists and bad input is ignored without throwing ----
const s = createGame(7, {});
const bad = [{ type: 'place', kind: 'arrow', tx: 1.5, ty: 2 }, { type: 'place', kind: 'arrow', tx: 'a', ty: null }, { type: 'move', id: 1, tx: NaN, ty: 0 },
  { type: 'meteor', x: NaN, y: 3 }, { type: 'wall', tx: 0.5, ty: 1 }, { type: 'constructor' }, { type: 'toString' }, null, 5, {}];
let threw = false;
try { step(s, bad); } catch (e) { threw = true; lines.push('  ' + e.stack); }
check('commands: malformed input ignored', !threw && s.towers.length === 0 && s.walls.length === 0);
check('commands: registry covers client commands', ['place', 'upgrade', 'evolve', 'sell', 'move', 'aura', 'clear', 'barrel', 'collect', 'nextWave', 'meteor', 'nova', 'wall', 'pick'].every((k) => typeof COMMANDS[k] === 'function'));

// ---- real UI boot ----
const errors = [];
const frame = document.getElementById('app');
frame.contentWindow.addEventListener('error', (e) => errors.push(e.message));
for (let i = 0; i < 100 && !(frame.contentDocument && frame.contentDocument.getElementById('menu') && frame.contentDocument.querySelector('.mode-tile')); i++) await wait(50);
const d = frame.contentDocument;
const q = (sel) => d.querySelector(sel);
const hidden = (id) => d.getElementById(id).classList.contains('hidden');
check('ui: menu shown on boot', !hidden('menu'));
check('ui: 4 mode tiles', d.querySelectorAll('.mode-tile').length === 4);
check('ui: talent tree rendered', d.querySelectorAll('.tv-col').length === 4);
check('ui: build bar + abilities', d.querySelectorAll('.tower-btn').length === 7 &&d.querySelectorAll('.ability').length >= 3);
q('.mode-tile.mode-campaign').click();
await wait(100);
check('ui: campaign road', d.querySelectorAll('.camp-node').length === 10);
q('.mode-tile.mode-classic').click();
d.getElementById('playSolo').click();
await wait(400);
check('ui: run starts, menu hidden', hidden('menu'));
d.getElementById('next').click();
await wait(300);
// headless iframes starve requestAnimationFrame, so drive the fixed-step loop by hand
const A = await frame.contentWindow.eval("import('/src/client/app.js')");
const L = await frame.contentWindow.eval("import('/src/client/loop.js')");
const t0 = frame.contentWindow.performance.now();
for (let i = 1; i <= 40; i++) L.simulate(t0 + i * 50);
check('ui: wave started', A.app.state.wave >= 1, 'wave=' + A.app.state.wave + ' tick=' + A.app.state.tick);
d.getElementById('toMenu').click();
await wait(600);
check('ui: back to menu with resume', !hidden('menu') && !hidden('resume'), 'menu hidden=' + hidden('menu') + ' resume hidden=' + hidden('resume') + ' running=' + A.app.running);
d.getElementById('resume').click();
await wait(600);
check('ui: resume hides menu', hidden('menu'));
// run summary: the loop counts events; a boss kill ends up in the bestiary at the end of the run
const S = await frame.contentWindow.eval("import('/src/client/summary.js')");
check('summary: counts the running game', S.summary.kills === A.app.state.kills, `summary=${S.summary.kills} state=${A.app.state.kills}`);
S.collect([{ type: 'bossSpawn', bk: 'kvak' }, { type: 'death', kind: 'boss', bk: 'kvak', by: 'arrow', p: 0 }]);
check('summary: boss + kill by family', S.summary.bossesKilled.includes('kvak') && S.summary.byFamily.arrow >= 1);
d.getElementById('toMenu').click();
await wait(300);
d.querySelector('.menu-tabs [data-tab="bestiary"]').click();
await wait(100);
check('ui: bestiary shows every boss', d.querySelectorAll('.bst-card').length === Object.keys((await frame.contentWindow.eval("import('/src/sim/data.js')")).BOSSES).length, 'cards=' + d.querySelectorAll('.bst-card').length);
check('ui: no uncaught errors', errors.length === 0, errors.join(' | '));

lines.push('');
lines.push(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = lines.join('\n');
</script>
